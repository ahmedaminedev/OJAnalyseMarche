    <script>
      // Per AI Studio constraints: HMR is disabled, ignore WebSocket errors.
      (function() {
        // 1. Intercept console.error / console.warn for Vite websocket messages
        var origError = console.error;
        var origWarn = console.warn;
        var isWsError = function(args) {
          for (var i = 0; i < args.length; i++) {
            var str = String(args[i] || '');
            if (
              str.indexOf('[vite] failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('WebSocket connection to') !== -1
            ) {
              return true;
            }
          }
          return false;
        };

        console.error = function() {
          if (isWsError(arguments)) return;
          origError.apply(console, arguments);
        };

        console.warn = function() {
          if (isWsError(arguments)) return;
          origWarn.apply(console, arguments);
        };

        // 2. Prevent window-level unhandled rejection / error events
        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
